[project]
name = "python-pi"
version = "0.83.0"
description = "Python port of the Pi agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.5",
    "typer==0.20.0",
    "rich==14.2.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pathspec==0.12.1",
    "filelock==3.20.3",
    "packaging==25.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
memory = [
    "onnxruntime==1.20.1",
    "tokenizers==0.21.0",
    "huggingface-hub==0.27.0",
    "sqlite-vec==0.1.6",
]
eval = [
    "pytest-evals==0.3.4",
    "pytest-xdist==3.8.0",
]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.8",
    "mypy==1.19.0",
    "pip-audit==2.10.0",
    "types-pyyaml==6.0.12.20260724",
    "python-pi[memory]",
    "python-pi[eval]",
]

[project.scripts]
pi = "pi_coding_agent.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pi_ai",
    "src/pi_agent_core",
    "src/pi_tui",
    "src/pi_coding_agent",
    "src/pi_protocol",
    "src/pi_client",
    "src/pi_server",
    "src/pi_storage_sqlite",
    "src/pi_memory",
    "src/pi_evals",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["onnxruntime", "tokenizers", "huggingface_hub", "huggingface_hub.utils", "sqlite_vec"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
